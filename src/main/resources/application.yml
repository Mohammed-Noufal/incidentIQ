spring:
  application:
    name: incident-agent
  config:
    # Optional convenience: load KEY=value pairs from a local ".env" file so you do not
    # have to set Windows environment variables by hand. Real env vars also work.
    import: "optional:file:.env[.properties]"
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/incident_agent}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:noufal@Mysql123}"
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate never creates or changes tables.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: "${SERVER_PORT:8080}"
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

app:
  auth:
    username: "admin"
    password: "change-me-admin"
    token-validity-seconds: 3600
  security:
    jwt:
      # Demo default key (Base64-encoded 256 bits). Kept directly in application.yml.
      secret: "1q6KtHHsuXf4UxAmNgXSKVXZ3rUrNwYDrFZQ9CyTRk4="
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,http://localhost:5174,http://127.0.0.1:5174}"
  dev-data:
    enabled: "${APP_DEV_DATA:false}"
  # External provider secrets come from environment variables only.
  groq:
    api-key: "${GROQ_API_KEY:}"
    model: "${GROQ_MODEL:openai/gpt-oss-20b}"
  hindsight:
    api-key: "${HINDSIGHT_API_KEY:}"
    base-url: "${HINDSIGHT_BASE_URL:https://api.hindsight.vectorize.io}"
    bank-id: "${HINDSIGHT_BANK_ID:incident-iq-demo}"
