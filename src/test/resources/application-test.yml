# Used by tests via @ActiveProfiles("test"): in-memory H2 in MySQL mode, no real keys.
spring:
  datasource:
    url: "jdbc:h2:mem:incident_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

app:
  auth:
    username: test-admin
    password: test-password
    token-validity-seconds: 3600
  security:
    jwt:
      secret: "dGVzdC1qd3Qtc2VjcmV0LW11c3QtYmUtYXQtbGVhc3QtMzItYnl0ZXMtbG9uZw=="
  dev-data:
    enabled: false
  groq:
    api-key: ""
  hindsight:
    api-key: ""
